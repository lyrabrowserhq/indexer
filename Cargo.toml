[package]
name = "lyra-index"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Crawler and Tantivy index API for Seek at index.lyrabrowser.com"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
dashmap = "6.2.1"
ego-tree = "0.11.1"
feed-rs = "3.0.0"
futures = "0.3.34"
hex = "0.4.3"
landlock = "0.4.7"
libc = "0.2.191"
parking_lot = "0.13.0"
rand = "0.10.3"
redb = "4.4.0"
reqwest = { version = "0.13.5", features = ["rustls", "gzip", "brotli", "deflate", "zstd", "cookies", "json", "stream", "charset", "query", "socks", "http2"] }
robotstxt = "0.3.0"
scraper = "0.29.0"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
tantivy = "0.27.0"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zstd = "0.14.3"

[dev-dependencies]
futures = "0.3.34"
tempfile = "3.27.0"
